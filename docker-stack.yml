# e-Skupština on Docker Swarm behind Traefik (swarm provider on the external `traefik` overlay network,
# websecure as the default entrypoint with TLS). Deploy as a Portainer stack, or:
#   docker stack deploy --with-registry-auth -c docker-stack.yml eskupstina
# Variables come from the Portainer stack environment (or the shell); see README "Docker Swarm".

x-app: &app
  image: ${IMAGE:-ghcr.io/stegnet/e-skupstine}:${TAG:-latest}
  networks:
    - internal

# The database volume is local, so the database is pinned to the manager.
# The app itself keeps no state on disk and may run on any node.
x-deploy: &deploy
  replicas: 1
  restart_policy:
    condition: any
    delay: 5s

x-deploy-pinned: &deploy-pinned
  <<: *deploy
  placement:
    constraints:
      - node.role == manager

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eskupstina
      # Required variables use ${VAR:?…}: a missing one stops the deploy instead of becoming an empty value.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: eskupstina
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eskupstina"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    deploy: *deploy-pinned

  # Runs the database migrations on start, then serves on :3000.
  # One replica: two tasks starting together would run the migrations at the same time.
  app:
    <<: *app
    environment: &app-env
      BETTER_AUTH_URL: https://${DOMAIN:?set DOMAIN, e.g. glasanje.example.org}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      # The password goes separately: inside the URL, characters like % / ? # would be decoded or break it.
      DATABASE_URL: postgres://eskupstina@db:5432/eskupstina
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SMTP_URL: ${SMTP_URL}
      MAIL_FROM: ${MAIL_FROM}
      CERTILIA_DISCOVERY_URL: ${CERTILIA_DISCOVERY_URL:-}
      CERTILIA_CLIENT_ID: ${CERTILIA_CLIENT_ID:-}
      CERTILIA_CLIENT_SECRET: ${CERTILIA_CLIENT_SECRET:-}
      CERTILIA_SCOPES: ${CERTILIA_SCOPES:-openid profile email}
      OKTA_ISSUER: ${OKTA_ISSUER:-}
      OKTA_CLIENT_ID: ${OKTA_CLIENT_ID:-}
      OKTA_CLIENT_SECRET: ${OKTA_CLIENT_SECRET:-}
      OKTA_ADMIN_GROUP: ${OKTA_ADMIN_GROUP:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
    configs:
      # The udruga's statute rules (see README "Statut"), mounted over the image's default.
      - source: statut
        target: /usr/src/app/statut.json
    networks:
      - internal
      - traefik
    deploy:
      <<: *deploy
      # Start the new task before stopping the old one, roll back if it fails its health check.
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s
      labels:
        - traefik.enable=true
        - traefik.http.routers.${STACK_NAME:-eskupstina}.rule=Host(`${DOMAIN}`)
        - traefik.http.services.${STACK_NAME:-eskupstina}.loadbalancer.server.port=3000

  # Deletes old guest accounts every Monday at 03:00 (Zagreb time), matching the Sentry cron monitor.
  purge-guests:
    <<: *app
    command:
      - sh
      - -c
      - |
        while true; do
          sleep $$(( $$(date -d 'next monday 03:00' +%s) - $$(date +%s) ))
          node scripts/purge-guests.mts ${GUEST_RETENTION_DAYS:-90} || true
        done
    environment:
      <<: *app-env
      TZ: Europe/Zagreb
    # The image's health check probes the web server, which this service doesn't run.
    healthcheck:
      disable: true
    stop_grace_period: 60s
    deploy: *deploy

networks:
  internal:
    driver: overlay
  traefik:
    external: true

volumes:
  db-data:

configs:
  statut:
    # Configs are immutable: to change the rules, create a new config and point STATUT_CONFIG at it.
    external: true
    name: ${STATUT_CONFIG:-eskupstina_statut}
